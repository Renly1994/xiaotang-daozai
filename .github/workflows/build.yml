name: 构建 macOS 安装包

# 当前只交付 macOS。GitHub artifact 下载后是外层 ZIP，里面是可直接挂载的 DMG。
on:
  push:
    branches: [main, master]
    paths:
      - 'daozai_flutter/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: daozai_flutter

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 macOS 工程
        run: flutter create --platforms=macos --org com.dynamicisland --project-name dynamic_island .

      - name: 移除默认模板测试
        run: rm -f test/widget_test.dart

      - name: 注入 macOS 配置
        run: bash ci/setup_platform.sh macos

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-fatal-infos

      - name: 自动化测试
        run: flutter test --coverage

      - name: 构建 DynamicIsland.app
        run: flutter build macos --release

      - name: 打包并验证 DMG
        run: bash ci/package_macos.sh

      - name: 上传 macOS 安装包
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-macos
          path: |
            daozai_flutter/DynamicIsland-macos.dmg
            daozai_flutter/SHA256SUMS.txt
            daozai_flutter/README-macOS.txt
          if-no-files-found: error
          retention-days: 14
