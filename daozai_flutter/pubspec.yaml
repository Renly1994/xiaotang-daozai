name: daozai_flutter
description: "岛仔跨平台版 —— 基于开源岛仔(Rust/egui)重做的 Flutter 多平台桌面伙伴。支持 Windows / macOS / Android。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # 桌面悬浮岛：透明、置顶、无边框窗口（Windows / macOS / Linux；移动端为 no-op）。
  window_manager: ^0.4.3
  # 轻量状态管理
  provider: ^6.1.2
  # 本地持久化（待办 / 设置）
  shared_preferences: ^2.3.2
  # 日期格式化
  intl: ^0.19.0
  # 待办本地提醒：系统级定时通知（v19 起支持 Windows，全平台覆盖）。
  # 锁定 19.0.0：该版 zonedSchedule/initialize 用位置参数；20.x 改命名参数，升级需同步改代码。
  flutter_local_notifications: 19.0.0
  # zonedSchedule 需要的时区支持（timezone 也是插件传递依赖，宽范围让 pub 解析兼容版）
  timezone: '>=0.9.0 <0.11.0'
  flutter_timezone: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true