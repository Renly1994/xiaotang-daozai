name: dynamic_island
description: "DynamicIsland macOS 桌面伙伴。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # 桌面悬浮岛：透明、置顶、无边框窗口（Windows / macOS / Linux；移动端为 no-op）。
  window_manager: ^0.4.3
  # 轻量状态管理
  provider: ^6.1.2
  # 本地持久化（待办 / 设置）
  shared_preferences: ^2.3.2
  # 日期格式化
  intl: ^0.20.0
  # 系统控件中文文案（日期/时间选择器等）。
  flutter_localizations:
    sdk: flutter
  # 待办本地提醒：系统级定时通知（v19 起支持 Windows，全平台覆盖）。
  # 锁定 19.0.0：该版 zonedSchedule/initialize 用位置参数；20.x 改命名参数，升级需同步改代码。
  flutter_local_notifications: 19.0.0
  # zonedSchedule 需要的时区支持（timezone 也是插件传递依赖，宽范围让 pub 解析兼容版）
  timezone: '>=0.9.0 <0.11.0'
  flutter_timezone: 4.1.0
  # 待办变化即推送安卓小组件刷新计数。锁定 0.10.0：updateWidget 用命名参数
  # qualifiedAndroidName，升级需核对签名（教训同 flutter_local_notifications）。
  home_widget: 0.10.0
  # ---- T1 跨端文件置物架（锁精确版本，N3 教训；升级需核对 API 签名）----
  # 索引库：macOS/Android 原生通道；Windows/Linux 走 sqflite_common_ffi。
  sqflite: 2.4.6
  sqflite_common_ffi: 2.4.7
  # 纯 Dart 加密：X25519/Ed25519/XChaCha20-Poly1305/AES-GCM/HKDF（三端一致，无 FFI）。
  cryptography: 2.9.0
  # 密钥安全存储：macOS Keychain / Windows DPAPI / Android Keystore。
  flutter_secure_storage: 11.2.0
  # Win/mac 系统拖放（OLE/NSDragging）；onDragEntered/Exited/Done 回调。
  desktop_drop: 0.9.2
  # 桌面双窗口：主控制台与悬浮岛独立运行。
  desktop_multi_window: 0.3.1
  uuid: 4.6.0
  path_provider: 2.1.6
  # SHA-256 流式哈希（内容去重与校验）。
  crypto: 3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
